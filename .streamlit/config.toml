[theme]
base = "light"
# 学术靛蓝主色：用于主按钮、滑杆、链接、聊天发送键，替代 Streamlit 默认红色
primaryColor = "#4F46E5"
# 应用底色：极浅冷灰，衬托白色卡片
backgroundColor = "#F5F6FA"
# 次级面：侧边栏/输入框等容器底色
secondaryBackgroundColor = "#ECEEF5"
# 正文墨色
textColor = "#1E2433"
font = "sans serif"

[server]
headless = true

# 关闭使用统计：避免 Streamlit 首次运行时向 ~/.streamlit 写入 machine_id_v4。
# 在目录无写权限的环境（如沙箱/受限容器）中，该写入失败会导致 NEW_SESSION
# 消息构造异常，前端收不到工具栏配置而不渲染右上角 ⋮ 菜单（toolbarMode 停留在 minimal）。
[browser]
gatherUsageStats = false
